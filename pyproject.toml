[project]
name = "qsim-py"
version = "1.3.7"
description = "Quantitative simulation stack: qsim core engine + data providers + Prefect-based data tools."
readme = "CLAUDE.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# 依赖来源:
#   - tools/release/legacy_requirements.txt (qsim core)
#   - tools/release/legacy_data_tools_setup.py (data tools)
#   - 实际源码 import (补 lz4 等)
#
# TODO(deps): 以下依赖待整理 ——
#   * prefect == 0.14.15 不支持 Python 3.12, 需升级到 prefect 2.x/3.x 并改写 prefect_task.py
#   * pycryptodome / redis 仅 build_cython.py 的 copy_only_list 提到 (crypto_api.py / redis_client.py
#     源码目前不在仓库里), 真正需要时再加
dependencies = [
    # qsim core
    "numpy>=1.13.0",
    "pandas",
    "pyyaml",
    "sortedcollections",
    "click",
    "numcodecs",
    "cython",
    "xmltodict",
    "lz4",
    "pymysql",

    # qsim_data_tools (Prefect 等暂时注释, 升级前不会被装入)
    # "prefect==0.14.15",
    # "prefect[viz]==0.14.15",
    "paramiko",
    "pytz",
]

[project.optional-dependencies]
dev = [
    "ipython",
    "jupyter",
]

[project.scripts]
qsim = "qsim.qsim_run:main"
stats_general = "qsim.modules.stats_general:main"
update_tools = "qsim_data_tools.update_tools:cli"

# ---------------------------------------------------------------------
# 单一 src layout 下两个包共享一个 wheel
# ---------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qsim", "src/qsim_data_tools"]

[tool.uv]
package = true
