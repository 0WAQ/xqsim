[project]
name = "xqsim"
dynamic = ["version"]
description = "Quantitative simulation stack: xqsim core engine + data providers + Prefect-based data tools."
readme = "AGENTS.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.13.0",
    "pandas",
    "pyyaml",
    "click",
    "xmltodict",
    "lz4",
    "sortedcollections",
    "numcodecs",
    "pymysql",
    "pymssql>=2.3.13",
]

[project.optional-dependencies]
data-tools = [
    "prefect>=3.0",
    "paramiko",
    "pytz",
]
dev = [
    "ipython",
    "jupyter",
]
release = [
    "cython==3.2.9",
    "setuptools==84.0.0",
    "auditwheel>=6.7.0; sys_platform == 'linux'",
    "pyinstaller==6.21.0",
]

[project.scripts]
xqsim = "xqsim.xqsim_run:main"
stats_general = "xqsim.modules.StatsGeneral:main"
update_tools = "xqsim_data_tools.update_tools:cli"

# flat layout
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["./xqsim", "./xqsim_data_tools"]

[tool.hatch.version]
path = "xqsim/version.py"

[tool.uv]
package = true
