[project]
name = "xqsim"
version = "1.3.7"
description = "Quantitative simulation stack: xqsim core engine + data providers + Prefect-based data tools."
readme = "AGENTS.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# 依赖来源:
#   - tools/release/setup/setup.py (xqsim core; 仅做 wheel 打包)
#   - 实际源码 import (numpy/pandas/lz4/pymysql/...)
#
# TODO(deps): 以下依赖待整理 ——
#   * prefect 已升级到 3.x
#   * pycryptodome / redis 仅 build_cython.py 的 copy_only_list 提到 (crypto_api.py / redis_client.py
#     源码目前不在仓库里), 真正需要时再加
dependencies = [
    # xqsim core
    "numpy>=1.13.0",
    "pandas",
    "pyyaml",
    "sortedcollections",
    "click",
    "numcodecs",
    "cython",
    "xmltodict",
    "lz4",
    "pymysql",
    # xqsim_data_tools
    "prefect>=3.0",
    "paramiko",
    "pytz",
    "setuptools>=82.0.1",
    "pymssql>=2.3.13",
]

[project.optional-dependencies]
dev = [
    "ipython",
    "jupyter",
]

[project.scripts]
xqsim = "xqsim.xqsim_run:main"
stats_general = "xqsim.modules.stats_general:main"
update_tools = "xqsim_data_tools.update_tools:cli"

# flat layout
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["./xqsim", "./xqsim_data_tools"]

[tool.uv]
package = true
