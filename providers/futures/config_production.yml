# 期货生产 build 配置 (从 repo 根目录运行: uv run xqsim -c providers/futures/config_production.yml)
# 前置: providers/futures/mssql.json 填好真实凭证;
#       先跑 providers/futures/DataProviderMetaUpdater.py 生成 ${xqsim_data}/futures/cc/meta
macro:
  provider_dir: "${config}"

global:
  meta_dir: "${xqsim_data}/futures/cc"
  output_cache_dir: "${xqsim_data}/futures/cc"
  # 扁平布局: 数据目录 (Hot/KLine/...) 直接挂在 cc 下与 meta 同级, 不要 Data 层
  data_dir: ""
  begin_date: "20160101"
  end_date: "TODAY-1"
  build: true
  index_category: FUTURES
  adj_window: -1

provider:
  local:
    mssql_config: "mssql.json"
  Universe:
    file_path: "${provider_dir}/DataProviderUniverse.py"
  Hot:
    file_path: "${provider_dir}/DataProviderHot.py"
  KLine:
    file_path: "${provider_dir}/DataProviderKline.py"
  InstrumentInfo:
    file_path: "${provider_dir}/DataProviderInstrumentInfo.py"
  Industry:
    file_path: "${provider_dir}/DataProviderIndustry.py"
  Warehouse:
    file_path: "${provider_dir}/DataProviderWarehouse.py"
  InStock:
    file_path: "${provider_dir}/DataProviderInstock.py"
  WindCommodity:
    file_path: "${provider_dir}/DataProviderWindCommodity.py"
  PositionsRank:
    file_path: "${provider_dir}/DataProviderPositionsRank.py"
