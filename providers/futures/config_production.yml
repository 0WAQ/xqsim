# 期货生产 build 配置 (从 repo 根目录运行: uv run xqsim -c providers/futures/config_production.yml)
# 前置: providers/futures/mssql.json 填好真实凭证;
#       先跑 providers/futures/meta_updater.py 生成 data/futures/cc/meta
macro:
  provider_dir: "./providers/futures"

global:
  meta_dir: "./data/futures/cc"
  output_cache_dir: "./data/futures/cc_update"
  begin_date: "20160101"
  end_date: "TODAY-1"
  build: true
  index_category: FUTURES
  adj_window: -1

provider:
  local:
    mssql_config: "mssql.json"
  Universe:
    file_path: "${provider_dir}/universe.py"
  Hot:
    file_path: "${provider_dir}/hot.py"
  KLine:
    file_path: "${provider_dir}/kline.py"
  InstrumentInfo:
    file_path: "${provider_dir}/instrument_info.py"
  Warehouse:
    file_path: "${provider_dir}/warehouse.py"
  InStock:
    file_path: "${provider_dir}/instock.py"
  WindCommodity:
    file_path: "${provider_dir}/wind_commodity.py"
